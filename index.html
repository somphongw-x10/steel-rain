<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; font-family: monospace; }
  /* Fit the 2:3 canvas to the viewport (internal resolution stays 480x720) */
  #gameCanvas {
    border: 2px solid #333; image-rendering: pixelated; display: block;
    width: min(100vw, calc((100vh - 26px) * 2 / 3));
    width: min(100vw, calc((100dvh - 26px) * 2 / 3));
    height: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #ui { color: #aaa; font-size: 12px; margin-top: 6px; text-align: center; }
  @media (pointer: coarse) {
    #ui { display: none; }
    #gameCanvas { border: none; width: min(100vw, calc(100dvh * 2 / 3)); }
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="720"></canvas>
<div id="ui">WASD/Arrows: Move | Z/Space: Shoot | X: Bomb | R: Reload | P: Pause</div>
<script src="game.js"></script>
</body>
